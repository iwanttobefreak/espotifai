services:
  espotifai:
    build: ../../server
    image: espotifai-server
    container_name: espotifai
    restart: unless-stopped
    volumes:
      - "${MUSIC_DIR:-./music}:/music:ro"
      - "./data:/app/data"
    environment:
      MUSIC_DIR: /music
      PORT: "8088"
      API_TOKEN: "${API_TOKEN:?Define API_TOKEN en .env}"
      EXCLUDE_DIRS: "${EXCLUDE_DIRS:-}"

  nginx:
    image: nginx:1.27-alpine
    container_name: espotifai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./espotifai-locations.conf:/etc/nginx/snippets/espotifai-locations.conf:ro"
      # App web y APK (el APK se deja en webapp/apk/)
      - "../../webapp:/usr/share/nginx/html/espotifai-app:ro"
      - "./certbot/conf:/etc/letsencrypt:ro"
      - "./certbot/www:/var/www/certbot:ro"
    depends_on:
      - espotifai

  # Renueva los certificados cada 12 h. La emisión inicial se hace a mano
  # (ver README): docker compose run --rm --entrypoint certbot certbot certonly ...
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - "./certbot/conf:/etc/letsencrypt"
      - "./certbot/www:/var/www/certbot"
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
