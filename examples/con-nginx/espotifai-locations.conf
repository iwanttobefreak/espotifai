# Locations comunes para HTTP y HTTPS.
# Se incluyen desde nginx.conf dentro de cada server { }.

# App web de la instancia (se monta ../../webapp en el compose)
location = / {
    root /usr/share/nginx/html/espotifai-app;
    try_files /index.html =404;
}

# APK: deja los ficheros en web/apk/ (no se versionan)
location = /apk {
    return 301 /apk/;
}

location /apk/ {
    alias /usr/share/nginx/html/espotifai-app/apk/;
    autoindex on;
    types {
        application/vnd.android.package-archive apk;
    }
}

# API + streaming + ZIP de álbumes
location /api/ {
    proxy_pass http://espotifai:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
    proxy_buffers 12 12k;
    proxy_redirect off;
    proxy_read_timeout 300s;
}

# App web (rutas del navegador)
location / {
    root /usr/share/nginx/html/espotifai-app;
    try_files $uri /index.html;
}
