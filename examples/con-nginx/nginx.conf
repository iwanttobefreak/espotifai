# nginx del ejemplo "con nginx".
# Cambia micasa.espotifai.es por tu dominio.
#
# 1) Arranca en HTTP y emite el certificado con certbot (ver README).
# 2) Descomenta el bloque 443 y reinicia nginx.

server {
    listen 80;
    server_name micasa.espotifai.es;

    # Retos HTTP-01 de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Landing, /apk/ y proxy a la API
    include /etc/nginx/snippets/espotifai-locations.conf;
}

